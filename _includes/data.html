{%- assign mesi = "gennaio,febbraio,marzo,aprile,maggio,giugno,luglio,agosto,settembre,ottobre,novembre,dicembre" | split: "," -%}
{%- assign m = include.data | date: "%-m" | minus: 1 -%}
<time datetime="{{ include.data | date: '%Y-%m-%d' }}">{{ include.data | date: "%-d" }} {{ mesi[m] }} {{ include.data | date: "%Y" }}</time>
