<footer class="it-footer">
  <div class="it-footer-main"><div class="container"><section class="py-4"><div class="row">
    <div class="col-md-6">
      <h2 class="h5 text-white">{{ site.sito.nome }}</h2>
      <p class="text-white mb-0">{{ site.footer.testo }}</p>
    </div>
    {% if site.social.size > 0 %}
    <div class="col-md-6">
      <h2 class="h5 text-white">{{ site.header.contatti_etichetta | default: "Contatti" }}</h2>
      <nav aria-label="Contatti"><ul class="list-unstyled mb-0">
        {% for s in site.social %}<li><a class="text-white" href="{{ s.url }}">{{ s.nome }}</a></li>{% endfor %}
      </ul></nav>
    </div>
    {% endif %}
  </div></section>
  <p class="text-white small pb-3 mb-0">© {{ 'now' | date: '%Y' }} {{ site.sito.nome }}</p>
  </div></div>
</footer>
