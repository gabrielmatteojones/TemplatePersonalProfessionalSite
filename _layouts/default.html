<!DOCTYPE html>
<html lang="{{ site.lang | default: 'it' }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% if page.title and page.url != '/' %}{{ page.title | escape }} – {% endif %}{{ site.sito.nome | escape }}</title>
  <meta name="description" content="{{ page.description | default: site.sito.descrizione | strip_html | escape }}">
  {% feed_meta %}
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-italia@2.8.0/dist/css/bootstrap-italia.min.css">
  <link rel="stylesheet" href="{{ '/assets/css/tema.css' | relative_url }}">
</head>
<body>
{% include header.html %}
<main id="main" class="container py-5" tabindex="-1">
{{ content }}
</main>
{% include footer.html %}
<script>window.__PUBLIC_PATH__ = "https://cdn.jsdelivr.net/npm/bootstrap-italia@2.8.0/dist/fonts"</script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap-italia@2.8.0/dist/js/bootstrap-italia.bundle.min.js"></script>
</body>
</html>
